# Configuration Firebase App Hosting — GO Project Hub (GamersOrigin)
# Documentation : https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  minInstances: 0
  maxInstances: 4

env:
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  # Laisser "true" tant que les tests pilotes sont actifs (protège les dossiers PROD).
  # Passer à "false" uniquement lors de l'ouverture complète sur les projets clients réels.
  - variable: SANDBOX_MODE
    value: "true"
    availability:
      - RUNTIME

  # --- Secrets Cloud Secret Manager à décommenter après création (`firebase apphosting:secrets:set`) ---
  # - variable: DATABASE_URL
  #   secret: DATABASE_URL
  #   availability:
  #     - BUILD
  #     - RUNTIME
  # - variable: APP_BASE_URL
  #   value: https://<votre-backend>.hosted.app
  #   availability:
  #     - RUNTIME
